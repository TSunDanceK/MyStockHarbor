<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0f1a">
<title>MyStockHarbor — Dashboard Redesign Previews</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#05080f;color:#eaf0fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .wrap{max-width:420px;width:100%;}
  img.logo{height:34px;width:auto;display:block;margin:0 auto 22px;}
  h1{font-size:20px;font-weight:700;text-align:center;letter-spacing:-.01em;}
  p.sub{font-size:13px;color:#8a97ad;text-align:center;margin:8px 0 26px;line-height:1.5;}
  a.card{display:flex;align-items:center;gap:14px;background:#141b2b;border:1px solid #222c40;border-radius:16px;padding:18px;text-decoration:none;color:inherit;margin-bottom:14px;transition:.15s;}
  a.card:hover{border-color:#2f6bff;}
  .ic{width:46px;height:46px;flex:0 0 auto;border-radius:12px;display:grid;place-items:center;background:#13213f;border:1px solid #27406f;color:#9cc0ff;}
  .t b{font-size:15px;font-weight:700;display:block;}
  .t span{font-size:12.5px;color:#8a97ad;}
  .arrow{margin-left:auto;color:#8a97ad;font-size:20px;}
  .note{font-size:11px;color:#5f6b80;text-align:center;margin-top:18px;line-height:1.5;}
</style>
</head>
<body>
  <div class="wrap">
    <img src="/logo.png" alt="MyStockHarbor" class="logo" onerror="this.style.display='none'">
    <h1>Dashboard redesign previews</h1>
    <p class="sub">Two non-deployed mockups of the chart / dashboard page. Tap to open.</p>

    <a class="card" href="/preview/dashboard-mobile.html">
      <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="3" width="12" height="18" rx="2.5"/><line x1="11" y1="18" x2="13" y2="18"/></svg></span>
      <span class="t"><b>Mobile view</b><span>Phone layout · best opened on your phone</span></span>
      <span class="arrow">&rarr;</span>
    </a>

    <a class="card" href="/preview/dashboard-desktop.html">
      <span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="13" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></span>
      <span class="t"><b>Desktop view</b><span>Two-column layout · best on a wide screen</span></span>
      <span class="arrow">&rarr;</span>
    </a>

    <p class="note">Preview mockups only — not wired into the live site, nothing deployed to production.</p>
  </div>
</body>
</html>
