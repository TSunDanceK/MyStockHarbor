<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img">
<rect x="0" y="0" width="1200" height="560" fill="#06080d"/>
<g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
<text x="40" y="52" font-size="26" fill="#f1f5f9" font-weight="800">The balance sheet always balances</text><text x="40" y="84" font-size="16" fill="#94a3b8" font-weight="400">Everything a company owns is funded by what it owes plus what shareholders own.</text><text x="260.0" y="120" font-size="15" fill="#5eead4" font-weight="900" text-anchor="middle" letter-spacing="0.05em">ASSETS  -  what it owns</text><rect x="90" y="341.6" width="340" height="158.4" rx="8" fill="#5eead4" fill-opacity="0.22" stroke="#5eead4" stroke-width="1.2" stroke-opacity="0.6"/><text x="108" y="367.6" font-size="14.5" fill="#f1f5f9" font-weight="700">Property &amp; equipment</text><text x="412" y="367.6" font-size="14.5" fill="#5eead4" font-weight="800" text-anchor="end">$220m</text><rect x="90" y="285" width="340" height="50" rx="8" fill="#fbbf24" fill-opacity="0.22" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.6"/><text x="108" y="311" font-size="14.5" fill="#f1f5f9" font-weight="700">Inventory</text><text x="412" y="311" font-size="14.5" fill="#fbbf24" font-weight="800" text-anchor="end">$70m</text><rect x="90" y="214" width="340" height="64.8" rx="8" fill="#60a5fa" fill-opacity="0.22" stroke="#60a5fa" stroke-width="1.2" stroke-opacity="0.6"/><text x="108" y="240" font-size="14.5" fill="#f1f5f9" font-weight="700">Receivables</text><text x="412" y="240" font-size="14.5" fill="#60a5fa" font-weight="800" text-anchor="end">$90m</text><rect x="90" y="122" width="340" height="86" rx="8" fill="#34d399" fill-opacity="0.22" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6"/><text x="108" y="148" font-size="14.5" fill="#f1f5f9" font-weight="700">Cash</text><text x="412" y="148" font-size="14.5" fill="#34d399" font-weight="800" text-anchor="end">$120m</text><text x="470" y="320" font-size="44" fill="#f1f5f9" font-weight="800" text-anchor="middle">=</text><text x="730.0" y="120" font-size="15" fill="#c084fc" font-weight="900" text-anchor="middle" letter-spacing="0.05em">LIABILITIES + EQUITY  -  how it&#x27;s funded</text><rect x="560" y="370.4" width="340" height="129.6" rx="8" fill="#f87171" fill-opacity="0.22" stroke="#f87171" stroke-width="1.2" stroke-opacity="0.6"/><text x="578" y="396.4" font-size="14.5" fill="#f1f5f9" font-weight="700">Long-term debt</text><text x="882" y="396.4" font-size="14.5" fill="#f87171" font-weight="800" text-anchor="end">$180m</text><rect x="560" y="321.2" width="340" height="43" rx="8" fill="#ef4444" fill-opacity="0.22" stroke="#ef4444" stroke-width="1.2" stroke-opacity="0.6"/><text x="578" y="347.2" font-size="14.5" fill="#f1f5f9" font-weight="700">Short-term debt</text><text x="882" y="347.2" font-size="14.5" fill="#ef4444" font-weight="800" text-anchor="end">$60m</text><rect x="560" y="272.0" width="340" height="43" rx="8" fill="#fbbf24" fill-opacity="0.22" stroke="#fbbf24" stroke-width="1.2" stroke-opacity="0.6"/><text x="578" y="298.0" font-size="14.5" fill="#f1f5f9" font-weight="700">Payables</text><text x="882" y="298.0" font-size="14.5" fill="#fbbf24" font-weight="800" text-anchor="end">$60m</text><rect x="560" y="122.0" width="340" height="144.0" rx="8" fill="#c084fc" fill-opacity="0.22" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.6"/><text x="578" y="148.0" font-size="14.5" fill="#f1f5f9" font-weight="700">Equity (book value)</text><text x="882" y="148.0" font-size="14.5" fill="#c084fc" font-weight="800" text-anchor="end">$200m</text><rect x="950" y="150" width="210" height="300" rx="16" fill="#0d1526" fill-opacity="0.9" stroke="rgba(255,255,255,0.10)" stroke-width="1" stroke-opacity="1.0"/><text x="1055" y="186" font-size="12.5" fill="#94a3b8" font-weight="800" text-anchor="middle" letter-spacing="0.08em">THE IDENTITY</text><text x="1055" y="232" font-size="18" fill="#5eead4" font-weight="900" text-anchor="middle">Assets</text><text x="1055" y="262" font-size="18" fill="#f1f5f9" font-weight="800" text-anchor="middle">=</text><text x="1055" y="292" font-size="18" fill="#f87171" font-weight="900" text-anchor="middle">Liabilities</text><text x="1055" y="318" font-size="18" fill="#f1f5f9" font-weight="800" text-anchor="middle">+</text><text x="1055" y="346" font-size="18" fill="#c084fc" font-weight="900" text-anchor="middle">Equity</text><text x="1055" y="392" font-size="13" fill="#94a3b8" font-weight="600" text-anchor="middle">$500m = $300m</text><text x="1055" y="412" font-size="13" fill="#94a3b8" font-weight="600" text-anchor="middle">+ $200m</text>
</g>
</svg>
