<text x="40" y="52" font-size="25" fill="#f1f5f9" font-weight="800">Follow the cash: three buckets to free cash flow</text><text x="40" y="84" font-size="16" fill="#94a3b8" font-weight="400">Operating cash pays for everything. Subtract capex and what&#x27;s left is free cash flow.</text><rect x="60" y="130" width="300" height="220" rx="16" fill="#0d1526" fill-opacity="0.9" stroke="#22c55e" stroke-width="1.4" stroke-opacity="0.42"/><rect x="60" y="130" width="300" height="52" rx="16" fill="#22c55e" fill-opacity="0.16"/><rect x="60" y="166" width="300" height="16" rx="0" fill="#22c55e" fill-opacity="0.16"/><text x="82" y="163" font-size="17" fill="#34d399" font-weight="900">Operating</text><text x="82" y="222" font-size="13" fill="#94a3b8" font-weight="600">Cash from the core business</text><text x="210" y="290" font-size="34" fill="#34d399" font-weight="900" text-anchor="middle">+$300m</text><text x="210" y="326" font-size="12.5" fill="#94a3b8" font-weight="500" text-anchor="middle">The engine of the company</text><rect x="390" y="130" width="300" height="220" rx="16" fill="#0d1526" fill-opacity="0.9" stroke="#3b82f6" stroke-width="1.4" stroke-opacity="0.42"/><rect x="390" y="130" width="300" height="52" rx="16" fill="#3b82f6" fill-opacity="0.16"/><rect x="390" y="166" width="300" height="16" rx="0" fill="#3b82f6" fill-opacity="0.16"/><text x="412" y="163" font-size="17" fill="#60a5fa" font-weight="900">Investing</text><text x="412" y="222" font-size="13" fill="#94a3b8" font-weight="600">Mostly capex on assets</text><text x="540" y="290" font-size="34" fill="#60a5fa" font-weight="900" text-anchor="middle">-$120m</text><text x="540" y="326" font-size="12.5" fill="#94a3b8" font-weight="500" text-anchor="middle">Spending to grow / maintain</text><rect x="720" y="130" width="300" height="220" rx="16" fill="#0d1526" fill-opacity="0.9" stroke="#eab308" stroke-width="1.4" stroke-opacity="0.42"/><rect x="720" y="130" width="300" height="52" rx="16" fill="#eab308" fill-opacity="0.16"/><rect x="720" y="166" width="300" height="16" rx="0" fill="#eab308" fill-opacity="0.16"/><text x="742" y="163" font-size="17" fill="#fbbf24" font-weight="900">Financing</text><text x="742" y="222" font-size="13" fill="#94a3b8" font-weight="600">Debt, dividends, buybacks</text><text x="870" y="290" font-size="34" fill="#fbbf24" font-weight="900" text-anchor="middle">-$100m</text><text x="870" y="326" font-size="12.5" fill="#94a3b8" font-weight="500" text-anchor="middle">Money in from / out to funders</text><rect x="60" y="390" width="1080" height="120" rx="16" fill="#2dd4bf" fill-opacity="0.1" stroke="#2dd4bf" stroke-width="1.5" stroke-opacity="0.5"/><text x="90" y="432" font-size="14" fill="#5eead4" font-weight="900" letter-spacing="0.06em">FREE CASH FLOW</text><text x="90" y="472" font-size="17" fill="#f1f5f9" font-weight="700">Operating cash flow  -  Capex</text><text x="560" y="455" font-size="24" fill="#f1f5f9" font-weight="800" text-anchor="middle">$300m  -  $120m  =</text><text x="900" y="458" font-size="40" fill="#5eead4" font-weight="900" text-anchor="middle">$180m</text><text x="900" y="492" font-size="12.5" fill="#94a3b8" font-weight="500" text-anchor="middle">cash free to fund debt, dividends &amp; buybacks</text>
