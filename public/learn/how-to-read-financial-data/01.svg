<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img">
<rect x="0" y="0" width="1200" height="560" fill="#06080d"/>
<g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
<text x="40" y="54" font-size="26" fill="#f1f5f9" font-weight="800">The three financial statements</text><text x="40" y="86" font-size="16" fill="#94a3b8" font-weight="400">Every company is described by three records. Learn the question each one answers.</text><rect x="40" y="120" width="360" height="380" rx="18" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.45"/><rect x="40" y="120" width="360" height="64" rx="18" fill="#3b82f6" fill-opacity="0.16"/><rect x="40" y="166" width="360" height="18" rx="0" fill="#3b82f6" fill-opacity="0.16"/><text x="62" y="160" font-size="17" fill="#60a5fa" font-weight="900" letter-spacing="0.05em">INCOME STATEMENT</text><text x="62" y="216" font-size="17" fill="#f1f5f9" font-weight="800">Is it making money?</text><rect x="58" y="238" width="324" height="40" rx="10" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5"/><text x="74" y="264" font-size="15.5" fill="#f1f5f9" font-weight="600">Revenue (top line)</text><rect x="58" y="290" width="324" height="40" rx="10" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5"/><text x="74" y="316" font-size="15.5" fill="#f1f5f9" font-weight="600">- Costs</text><rect x="58" y="342" width="324" height="40" rx="10" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5"/><text x="74" y="368" font-size="15.5" fill="#f1f5f9" font-weight="600">= Net profit (bottom line)</text><rect x="58" y="394" width="324" height="40" rx="10" fill="#0e1728" fill-opacity="0.5" stroke="rgba(255,255,255,0.10)" stroke-width="1" stroke-opacity="0.5"/><text x="74" y="420" font-size="15.5" fill="#94a3b8" font-weight="500">Covers a period (quarter / year)</text><rect x="420" y="120" width="360" height="380" rx="18" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-width="1.5" stroke-opacity="0.45"/><rect x="420" y="120" width="360" height="64" rx="18" fill="#2dd4bf" fill-opacity="0.16"/><rect x="420" y="166" width="360" height="18" rx="0" fill="#2dd4bf" fill-opacity="0.16"/><text x="442" y="160" font-size="17" fill="#5eead4" font-weight="900" letter-spacing="0.05em">BALANCE SHEET</text><text x="442" y="216" font-size="17" fill="#f1f5f9" font-weight="800">Is it financially solid?</text><rect x="438" y="238" width="324" height="40" rx="10" fill="#2dd4bf" fill-opacity="0.1" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.5"/><text x="454" y="264" font-size="15.5" fill="#f1f5f9" font-weight="600">Assets  (what it owns)</text><rect x="438" y="290" width="324" height="40" rx="10" fill="#2dd4bf" fill-opacity="0.1" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.5"/><text x="454" y="316" font-size="15.5" fill="#f1f5f9" font-weight="600">Liabilities  (what it owes)</text><rect x="438" y="342" width="324" height="40" rx="10" fill="#2dd4bf" fill-opacity="0.1" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.5"/><text x="454" y="368" font-size="15.5" fill="#f1f5f9" font-weight="600">Equity  (owners&#x27; stake)</text><rect x="438" y="394" width="324" height="40" rx="10" fill="#0e1728" fill-opacity="0.5" stroke="rgba(255,255,255,0.10)" stroke-width="1" stroke-opacity="0.5"/><text x="454" y="420" font-size="15.5" fill="#94a3b8" font-weight="500">A snapshot on one day</text><rect x="800" y="120" width="360" height="380" rx="18" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.45"/><rect x="800" y="120" width="360" height="64" rx="18" fill="#22c55e" fill-opacity="0.16"/><rect x="800" y="166" width="360" height="18" rx="0" fill="#22c55e" fill-opacity="0.16"/><text x="822" y="160" font-size="17" fill="#34d399" font-weight="900" letter-spacing="0.05em">CASH FLOW</text><text x="822" y="216" font-size="17" fill="#f1f5f9" font-weight="800">Is profit turning into cash?</text><rect x="818" y="238" width="324" height="40" rx="10" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-width="1" stroke-opacity="0.5"/><text x="834" y="264" font-size="15.5" fill="#f1f5f9" font-weight="600">Operating cash flow</text><rect x="818" y="290" width="324" height="40" rx="10" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-width="1" stroke-opacity="0.5"/><text x="834" y="316" font-size="15.5" fill="#f1f5f9" font-weight="600">Investing (capex)</text><rect x="818" y="342" width="324" height="40" rx="10" fill="#22c55e" fill-opacity="0.1" stroke="#22c55e" stroke-width="1" stroke-opacity="0.5"/><text x="834" y="368" font-size="15.5" fill="#f1f5f9" font-weight="600">Financing (debt, dividends)</text><rect x="818" y="394" width="324" height="40" rx="10" fill="#0e1728" fill-opacity="0.5" stroke="rgba(255,255,255,0.10)" stroke-width="1" stroke-opacity="0.5"/><text x="834" y="420" font-size="15.5" fill="#94a3b8" font-weight="500">Cash is hard to fake</text>
</g>
</svg>
