<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img">
<rect x="0" y="0" width="1200" height="600" fill="#06080d"/>
<g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
<text x="40" y="52" font-size="26" fill="#f1f5f9" font-weight="800">The income-statement waterfall</text><text x="40" y="84" font-size="16" fill="#94a3b8" font-weight="400">Example: from $1,000m of revenue down to $160m of net profit.</text><rect x="70" y="140.0" width="118" height="360.0" rx="8" fill="#60a5fa" fill-opacity="0.22" stroke="#60a5fa" stroke-width="1.2" stroke-opacity="0.6"/><text x="129.0" y="110.0" font-size="16" fill="#f1f5f9" font-weight="800" text-anchor="middle">$1000m</text><text x="129.0" y="129.0" font-size="12.5" fill="#60a5fa" font-weight="700" text-anchor="middle">100%</text><text x="129.0" y="524" font-size="13.5" fill="#f1f5f9" font-weight="600" text-anchor="middle">Revenue</text><rect x="230" y="140.0" width="118" height="144.0" rx="8" fill="#f87171" fill-opacity="0.2" stroke="#f87171" stroke-width="1.2" stroke-opacity="0.6"/><text x="289.0" y="128.0" font-size="14" fill="#f87171" font-weight="800" text-anchor="middle">-$400m</text><text x="289.0" y="524" font-size="13" fill="#94a3b8" font-weight="600" text-anchor="middle">- COGS</text><line x1="188" y1="140.0" x2="230" y2="140.0" stroke="rgba(255,255,255,0.10)" stroke-width="1" stroke-dasharray="4 4"/><line x1="348" y1="284.0" x2="390" y2="284.0" stroke="rgba(255,255,255,0.10)" stroke-width="1" stroke-dasharray="4 4"/><rect x="390" y="284.0" width="118" height="216.0" rx="8" fill="#5eead4" fill-opacity="0.22" stroke="#5eead4" stroke-width="1.2" stroke-opacity="0.6"/><text x="449.0" y="254.0" font-size="16" fill="#f1f5f9" font-weight="800" text-anchor="middle">$600m</text><text x="449.0" y="273.0" font-size="12.5" fill="#5eead4" font-weight="700" text-anchor="middle">60% margin</text><text x="449.0" y="524" font-size="13.5" fill="#f1f5f9" font-weight="600" text-anchor="middle">Gross profit</text><rect x="550" y="284.0" width="118" height="126" rx="8" fill="#f87171" fill-opacity="0.2" stroke="#f87171" stroke-width="1.2" stroke-opacity="0.6"/><text x="609.0" y="272.0" font-size="14" fill="#f87171" font-weight="800" text-anchor="middle">-$350m</text><text x="609.0" y="524" font-size="13" fill="#94a3b8" font-weight="600" text-anchor="middle">- Operating exp.</text><line x1="508" y1="284.0" x2="550" y2="284.0" stroke="rgba(255,255,255,0.10)" stroke-width="1" stroke-dasharray="4 4"/><line x1="668" y1="410.0" x2="710" y2="410.0" stroke="rgba(255,255,255,0.10)" stroke-width="1" stroke-dasharray="4 4"/><rect x="710" y="410.0" width="118" height="90.0" rx="8" fill="#34d399" fill-opacity="0.22" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.6"/><text x="769.0" y="380.0" font-size="16" fill="#f1f5f9" font-weight="800" text-anchor="middle">$250m</text><text x="769.0" y="399.0" font-size="12.5" fill="#34d399" font-weight="700" text-anchor="middle">25% margin</text><text x="769.0" y="524" font-size="13.5" fill="#f1f5f9" font-weight="600" text-anchor="middle">Operating income</text><rect x="870" y="410.0" width="118" height="32.4" rx="8" fill="#f87171" fill-opacity="0.2" stroke="#f87171" stroke-width="1.2" stroke-opacity="0.6"/><text x="929.0" y="398.0" font-size="14" fill="#f87171" font-weight="800" text-anchor="middle">-$90m</text><text x="929.0" y="524" font-size="13" fill="#94a3b8" font-weight="600" text-anchor="middle">- Interest &amp; tax</text><line x1="828" y1="410.0" x2="870" y2="410.0" stroke="rgba(255,255,255,0.10)" stroke-width="1" stroke-dasharray="4 4"/><line x1="988" y1="442.4" x2="1030" y2="442.4" stroke="rgba(255,255,255,0.10)" stroke-width="1" stroke-dasharray="4 4"/><rect x="1030" y="442.4" width="118" height="57.6" rx="8" fill="#22c55e" fill-opacity="0.22" stroke="#22c55e" stroke-width="1.2" stroke-opacity="0.6"/><text x="1089.0" y="412.4" font-size="16" fill="#f1f5f9" font-weight="800" text-anchor="middle">$160m</text><text x="1089.0" y="431.4" font-size="12.5" fill="#22c55e" font-weight="700" text-anchor="middle">16% margin</text><text x="1089.0" y="524" font-size="13.5" fill="#f1f5f9" font-weight="600" text-anchor="middle">Net income</text><line x1="60" y1="500" x2="1160" y2="500" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
</g>
</svg>
