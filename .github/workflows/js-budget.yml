# FIRST-LOAD JS PER ROUTE, AGAINST A BUDGET (#552 COWORK #231).
# A compile-only Next build (no data, no secrets) and scripts/route-js-budget.mjs,
# which gzips and sums each route's client chunks from the build manifests and
# fails the run when the framework, the root layout (the header island) or a
# route group's page-only JS goes over its budget.
name: JS budget

on:
  pull_request:
    paths:
      - "app/**"
      - "lib/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "scripts/route-js-budget.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compile and measure
        run: node scripts/route-js-budget.mjs --build
