name: Warm MyStockHarbor Pickers & Earnings

# MANUAL ONLY. The schedule lives in vercel.json, not here.
#
# WHY THE SCHEDULE WAS REMOVED (2026-09-03). GitHub's scheduled workflows are
# best-effort: they are queued, delayed under load and sometimes dropped
# entirely, and 05:03 UTC sits in one of the busiest cron windows there is.
# Measured across all 29 scheduled runs on record, against a due time of 05:03
# UTC (06:03 BST):
#
#     Aug 05-06     +162 to +163 min      fired ~08:45 BST
#     Aug 07-14      +46 to  +80 min
#     Aug 15-26      +29 to  +46 min      the best stretch there has ever been
#     Aug 27        +678 min              fired 17:21 BST
#     Aug 28        +737 min              fired 18:19 BST
#     Aug 29 - Sep 2   +265 to +391 min   fired 10:27-12:34 BST
#     Sep 03        DID NOT FIRE          (still absent at 10:12 BST)
#
# IT HAS NEVER ONCE FIRED WITHIN HALF AN HOUR OF ITS SCHEDULE. The best day in
# the record is +29 minutes; the median day is worse; and for the last week a
# job whose entire purpose is "warm the site early in the morning" has been
# firing at lunchtime, when it fired at all. Vercel Cron has landed on time
# every day over the same period and attaches the Authorization header itself,
# so there is no secret to keep in step either.
#
# THE MANUAL TRIGGER IS NOT THE BROKEN PART and is deliberately kept. Run
# 33701587009 (2026-09-03 00:56, workflow_dispatch) returned 200 on all three
# calls: warm-picker-universe in 172s -- a real forced build -- and each
# earnings pass in ~4s. That is a useful "warm everything now" button, the
# secret is already wired for it, and the authentication assertions in
# scripts/check-cron-auth.mjs still apply to it.
#
# NO CRON ENTRIES WERE ADDED TO REPLACE THE TWO EXTRA EARNINGS PASSES. See the
# PR for the argument; the short version is that #406 let one run span minute
# buckets, so a single run's reach is (200-90) x 4 min = 440 calls against
# three passes' 120, and the batch constant -- not the pass count -- is the
# lever. It is sized from the /api/debug/earnings-concentration measurement
# added in #407, not from a guess made here.

on:
  workflow_dispatch: {}

jobs:
  warm:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://www.mystockharbor.com
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check the secret is present
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET is not set in this repository's Actions secrets. Every call below would 401 or silently no-op, which is exactly the failure this workflow spent weeks in. Add it under Settings > Secrets and variables > Actions, matching the value in the Vercel project."
            exit 1
          fi

      - name: Warm the picker universe, then two earnings passes
        run: |
          set -uo pipefail
          failures=0

          # ONE PLACE THAT BUILDS THE REQUEST. Every call is authenticated
          # because there is only one call site; adding a fourth target cannot
          # forget the header.
          #
          # The status is checked, not merely printed. `curl -sS -o /dev/null
          # -w "%{http_code}"` exits 0 on a 401, which is how three failing
          # calls read as a green run for weeks.
          #
          # THE BODY IS PRINTED, not discarded. These routes answer with their
          # own summary -- fetchedCount, deferredCount, outOfTime, refreshMode
          # -- and `-o /dev/null` threw it away, so "pass 2 returned 200 in 4
          # seconds" could not be read as either "it did 40 symbols quickly" or
          # "the queue was empty and it did nothing". Since this is now a
          # hand-pulled lever rather than a schedule, the person pulling it
          # should see what it did. Capped, because the pickers payload summary
          # is not small.
          call() {
            local label="$1" url="$2" body code
            body=$(curl -sS -w $'\n%{http_code}' \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${url}?t=$(date +%s)" || printf '\n000')
            code=$(printf '%s' "${body}" | tail -n 1)
            echo "${label}: HTTP ${code}"
            printf '%s' "${body}" | head -n -1 | head -c 500
            echo
            if [ "${code}" != "200" ]; then
              echo "::error::${label} returned ${code} (000 = curl could not complete the request). A warm job that silently does nothing is worse than one that is visibly broken."
              failures=$((failures + 1))
            fi
          }

          call "warm-picker-universe" "${BASE_URL}/api/jobs/warm-picker-universe"

          # Two further passes, two minutes apart, as the schedule used to do.
          # KEPT FOR THE MANUAL PATH ONLY: when a person pulls this lever they
          # usually want as much warmed as one press can manage, and the extra
          # passes cost nothing on a run nobody is waiting on.
          #
          # The gap clears the first pass's lock (EARNINGS_LOCK_TTL_SECONDS, now
          # 6 min). NOTE that since #406 a pass may run for up to its 240s
          # budget, so 120s is no longer guaranteed to be enough: if pass 1 runs
          # long, pass 2 answers { skipped: true, reason: "locked" } and does
          # nothing. Visible now that the body is printed. Not a problem in
          # practice yet -- both passes took ~4s on 2026-09-03 -- and not worth
          # tuning a manual lever over.
          sleep 120
          call "warm-earnings pass 1" "${BASE_URL}/api/jobs/warm-earnings"
          sleep 120
          call "warm-earnings pass 2" "${BASE_URL}/api/jobs/warm-earnings"

          if [ "${failures}" -ne 0 ]; then
            echo "::error::${failures} of 3 warm calls did not return 200."
            exit 1
          fi
