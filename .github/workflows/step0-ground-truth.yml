name: Step 0 — freeze the FMP ground truth

# MANUAL ONLY, AND NOT BECAUSE A SCHEDULE WAS FORGOTTEN.
#
# .github/workflows/pickers-warm.yml records the measurement: across all 29
# scheduled runs on record, GitHub's cron never once fired within half an hour of
# its schedule -- best +29 min, worst +737 min, and one day it did not fire at
# all. Its schedule was removed on 2026-09-03 for that reason. A dump whose whole
# value is "what was in the cache at a known moment" must not be handed to a
# trigger that cannot say when it ran.
#
# WHY THIS EXISTS AT ALL: THE SANDBOX CANNOT REACH THE THINGS THE PROBE NEEDS.
# Both Cowork and Claude Code sit behind an egress policy that refuses
# stooq.com, stooq.pl, www.sec.gov and data.sec.gov with 403 CONNECT, and it has
# no Redis credentials. An Actions runner has unrestricted internet and repo
# secrets, which is the pair nothing else here has. Step 0 goes first because it
# is the only task whose cost of delay is permanent -- the cache entries expire
# on their own TTLs and the FMP key that would refill them is on borrowed time.
#
# THE TOKEN IS UPSTASH'S READ-ONLY TOKEN, DELIBERATELY. Reads succeed; any write,
# delete or EXPIRE is refused by the server. So "read-only" is enforced by the
# credential rather than by the script being careful, and a permission error on a
# write here is the design working, NOT a bad secret. The dump script issues only
# GET / MGET / HGETALL / ZRANGE / SCAN / DBSIZE and imports nothing from
# lib/server/ -- see its header for why that second rule matters (redisBandwidth's
# meter would try to HINCRBY on every read).

on:
  workflow_dispatch:
    inputs:
      out_dir:
        description: "Directory to write the dump into (artifact name follows it)"
        required: false
        default: step0-dump

jobs:
  dump:
    runs-on: ubuntu-latest
    # The dump reads the whole universe one MGET chunk at a time. At ~700 symbols
    # and ~110 KB a history entry that is tens of round trips, not hundreds, but
    # the default 360-minute timeout is far more than it needs and a hung job
    # should fail rather than sit.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # THE SECRETS ARE CHECKED BEFORE ANYTHING ELSE RUNS, and the error says what
      # to do. pickers-warm.yml learned this the hard way: without the check, a
      # missing secret produced a green run that had done nothing, for weeks.
      - name: Check the Upstash credentials are present
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          missing=0
          for name in UPSTASH_REDIS_REST_URL UPSTASH_REDIS_REST_TOKEN; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::$name is not set in this repository's Actions secrets. Add it under Settings > Secrets and variables > Actions. Use Upstash's READ-ONLY token: this job must not be able to write."
              missing=$((missing + 1))
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "Both Upstash variables are present."

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # THE STATUS IS CHECKED AND THE OUTPUT IS KEPT, for pickers-warm.yml's
      # reason: a job that prints a summary and discards it cannot answer "did it
      # dump 700 symbols or 7" after the fact. The log is the record of coverage,
      # and coverage is the whole point of Step 0.
      - name: Dump the ground truth (read-only)
        id: dump
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          OUT_DIR: ${{ inputs.out_dir }}
        run: |
          set -o pipefail
          node scripts/step0-dump-ground-truth.mjs "${OUT_DIR}" 2>&1 | tee dump.log

      # Surfaced in the run summary so the coverage figures are readable without
      # opening the log or downloading the artifact. This is the number the whole
      # migration's later claims are capped by.
      - name: Put the coverage verdict in the run summary
        if: always()
        env:
          OUT_DIR: ${{ inputs.out_dir }}
        run: |
          {
            echo "## Step 0 — ground-truth dump"
            echo
            if [ -f "${OUT_DIR}/REPORT.json" ]; then
              echo '```json'
              node -e '
                const r = require("node:fs").readFileSync(process.env.OUT_DIR + "/REPORT.json", "utf8");
                const j = JSON.parse(r);
                console.log(JSON.stringify({
                  dumpedAt: j.dumpedAt,
                  universe: j.universe,
                  coverageVerdict: j.coverageVerdict,
                  totalBytes: j.totalBytes,
                  warnings: j.warnings,
                }, null, 2));
              '
              echo '```'
            else
              echo "No REPORT.json was produced — the dump did not get far enough to write one."
              echo
              echo '```'
              tail -n 40 dump.log 2>/dev/null || echo "(no dump.log)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # RETENTION IS SET EXPLICITLY. The default is 90 days; this artefact is the
      # only copy of data that cannot be regenerated once the TTLs lapse, so it
      # gets the maximum and a note to pull it down somewhere permanent.
      - name: Upload the dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.out_dir }}
          path: |
            ${{ inputs.out_dir }}/
            dump.log
          retention-days: 90
          if-no-files-found: error
