# Merge the six description shards (relay tasks sec-descriptions-1 … -6) into
# data/sec/descriptions.json and commit it to the branch (PR 3 render, #518).
# Same runner-side pattern as description-probe-commit.yml: the artifact host
# is refused to the sandbox, so the runner downloads and commits.
#
# TO REFRESH: re-run the six relay tasks, put their run IDs below, push.
name: Commit the filing descriptions

on:
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/descriptions-commit.yml"

permissions:
  contents: write
  actions: read

env:
  RUNS: "35789288651 35789291517 35789294321 35789297091 35789299509 35789301776"

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Download the shard artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p art
          for run in $RUNS; do
            name=$(gh api "repos/${{ github.repository }}/actions/runs/${run}/artifacts" --jq '.artifacts[0].name')
            echo "run ${run}: ${name}"
            gh run download "${run}" --repo "${{ github.repository }}" --name "${name}" --dir "art/${run}"
          done
      - name: Merge, verify, commit
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const { execSync } = require("node:child_process");
            const files = execSync("find art -name \"descriptions-part-*.json\"").toString().trim().split("\n").filter(Boolean);
            const shards = files.map((f) => JSON.parse(fs.readFileSync(f, "utf8")));
            const got = new Set(shards.map((s) => s.shard));
            if (got.size !== 6) { console.error(`::error::expected 6 distinct shards, got ${[...got].join(", ")}`); process.exit(1); }
            const rows = {}, misses = {}, notReached = [];
            for (const s of shards) { Object.assign(rows, s.rows); Object.assign(misses, s.misses); notReached.push(...s.notReached); }
            if (notReached.length) { console.error(`::error::${notReached.length} symbols not reached; re-run their shard`); process.exit(1); }
            const sorted = (o) => Object.fromEntries(Object.entries(o).sort(([a], [b]) => a.localeCompare(b)));
            const reg = JSON.parse(fs.readFileSync("data/sec/registrants.json", "utf8"));
            const total = Object.keys(reg.rows).length;
            const seen = Object.keys(rows).length + Object.keys(misses).length;
            if (seen !== total) { console.error(`::error::${seen} symbols accounted for, registrants has ${total}`); process.exit(1); }
            const out = {
              asOf: shards.map((s) => s.asOf).sort().at(-1),
              source: "SEC EDGAR: each registrant’s latest 10-K Item 1 / 20-F Item 4.B, located and cleaned by lib/server/secDescription.ts (scripts/sec-descriptions-build.mjs)",
              fields: ["form", "filedOn", "accession", "text"],
              rows: sorted(rows),
              misses: sorted(misses),
            };
            // ONE ROW PER LINE so a refresh diffs per symbol; each line is its own JSON.stringify.
            const block = (o) => "{\n" + Object.entries(o).map(([k, v]) => `${JSON.stringify(k)}:${JSON.stringify(v)}`).join(",\n") + "\n}";
            const text = `{"asOf":${JSON.stringify(out.asOf)},"source":${JSON.stringify(out.source)},"fields":${JSON.stringify(out.fields)},\n"rows":${block(out.rows)},\n"misses":${block(out.misses)}}\n`;
            JSON.parse(text);
            fs.writeFileSync("data/sec/descriptions.json", text);
            const why = {};
            for (const w of Object.values(misses)) { const k = w.replace(/\(\d+ chars\)/, "(n chars)").replace(/\d+x/, "Nx"); why[k] = (why[k] ?? 0) + 1; }
            console.log(`${total} symbols · described ${Object.keys(rows).length} · no description ${Object.keys(misses).length}`);
            for (const [w, n] of Object.entries(why).sort((a, b) => b[1] - a[1])) console.log(`  ${String(n).padStart(5)}  ${w}`);
          '
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sec/descriptions.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Commit the filing descriptions from relay runs ${RUNS}" -m "Six shards of scripts/sec-descriptions-build.mjs, merged (PR 3 render, #518)."
          git push origin "HEAD:${{ github.ref_name }}"
