# Re-read named symbols' SEC fact sets NOW (CODE-A, #552 COWORK #42), through
# the sec-facts job's own on-demand path (?symbol=X: "one symbol, on demand --
# for checking a single page after a deploy without waiting a day for the
# cron. Still goes through the same code path."). A hand-pulled lever: the
# schedule stays in vercel.json. Tickers only; each is validated before any
# request is made. The route's JSON summary is printed, capped.
name: SEC re-read

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Tickers, space- or comma-separated (max 10)"
        required: true

permissions:
  contents: read

jobs:
  reread:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://www.mystockharbor.com
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SYMBOLS: ${{ inputs.symbols }}
    steps:
      - name: Re-read each symbol through the sec-facts job
        run: |
          set -uo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET is not set in this repository's Actions secrets."
            exit 1
          fi
          syms=$(printf '%s' "${SYMBOLS}" | tr ',' ' ')
          n=0; failures=0
          for s in ${syms}; do
            n=$((n + 1))
            if [ "${n}" -gt 10 ]; then echo "::error::at most 10 symbols"; exit 1; fi
            if ! printf '%s' "${s}" | grep -Eq '^[A-Za-z0-9.-]{1,10}$'; then
              echo "::error::not a ticker: ${s}"; exit 1
            fi
            body=$(curl -sS --max-time 320 -w $'\n%{http_code}' \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${BASE_URL}/api/jobs/sec-facts?symbol=${s}&t=$(date +%s)" || printf '\n000')
            code=$(printf '%s' "${body}" | tail -n 1)
            echo "${s}: HTTP ${code}"
            printf '%s' "${body}" | head -n -1 | head -c 1500
            echo
            if [ "${code}" != "200" ]; then
              echo "::error::${s} returned ${code}"
              failures=$((failures + 1))
            fi
          done
          exit "${failures}"
