name: Generate learn lesson images

on:
  push:
    branches: [learn-education-overhaul]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install numpy matplotlib

      - name: Generate lesson charts
        run: python scripts/gen_learn_charts.py

      - name: Commit generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/learn
          git commit -m "Generate learn lesson chart images" || echo "No changes to commit"
          git push
