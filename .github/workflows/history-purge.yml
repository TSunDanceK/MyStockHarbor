# One-off history purge (#552 COWORK #103; runbook CODE-A #86 and the A
# handover, 2 Oct, §2). Delete this file in the follow-up PR once it has run.
#
# WHY A WORKFLOW. The rewrite and both asserts passed in a Claude session on
# 2 Oct (CODE-A #102), but a Claude cloud session cannot force-push every
# branch: the push came back HTTP 403. This job runs the same steps on a
# runner, and the push uses the owner's fine-grained PAT (PURGE_TOKEN: this
# repo only, Contents + Workflows read/write). Workflows write is needed
# because the rewrite touches .github/workflows/ history, which the default
# GITHUB_TOKEN may never push.
#
# PUBLIC LOG. The repo and its Actions logs are public, and the mirror holds
# the old history. So: SHAs, counts and PASS/FAIL only; filter-repo's own
# output goes to a file on the runner; no upload-artifact and no cache; the
# token is sent as a masked header and never appears in a URL.
#
# STOP RULE. Every pre-check and all three asserts come before the push,
# under `set -e`: any failure ends the job with nothing pushed.
#
# SECOND PASS (#552 CODE-A #105, COWORK #106). The first run (a5b8cc7 ->
# e50e6c5) passed --replace-text twice. git-filter-repo 2.47 declares that
# flag without action='append', so the second file silently replaced the
# first: only the vendor-label rules ran, and 7 blobs (5 paths) kept text the
# fmp-values rules target. The two rule files are now concatenated into one
# and passed once, and assert 3 scans every branch's blobs for any rule's
# match side before the push.
#
# check: scripts/check-history-purge.mjs
name: History purge (one-off)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PURGE to rewrite history and force-push every branch"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: history-purge
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Gate
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "PURGE" ]; then
            echo "::error::confirm must be PURGE; nothing done"
            exit 1
          fi
          echo "gate PASS"

      - name: Pre-checks
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          open_prs=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --jq 'length')
          other_runs=0
          for s in in_progress queued waiting requested pending; do
            n=$(gh api "repos/$REPO/actions/runs?status=$s&per_page=100" --jq "[.workflow_runs[] | select(.id != $RUN_ID)] | length")
            other_runs=$((other_runs + n))
          done
          api_main=$(gh api "repos/$REPO/commits/main" --jq '.sha')
          {
            echo "## Pre-checks"
            echo "- open PRs: $open_prs"
            echo "- other workflow runs in progress or queued: $other_runs"
            echo "- main (API): \`$api_main\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "open_prs=$open_prs other_runs=$other_runs main=$api_main"
          [ "$open_prs" -eq 0 ] || { echo "::error::pre-check FAIL: $open_prs open PRs"; exit 1; }
          [ "$other_runs" -eq 0 ] || { echo "::error::pre-check FAIL: $other_runs other runs active"; exit 1; }
          echo "API_MAIN=$api_main" >> "$GITHUB_ENV"
          echo "pre-checks PASS"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install git-filter-repo
        run: |
          set -euo pipefail
          python -m pip install --quiet git-filter-repo==2.47.0
          git filter-repo --version

      - name: Mirror clone (PAT)
        env:
          PURGE_TOKEN: ${{ secrets.PURGE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${PURGE_TOKEN:-}" ]; then
            echo "::error::secret PURGE_TOKEN is missing; nothing done"
            exit 1
          fi
          auth=$(printf 'x-access-token:%s' "$PURGE_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.extraHeader="Authorization: Basic $auth" \
            clone --quiet --mirror "https://github.com/$REPO.git" "$RUNNER_TEMP/mirror.git"
          echo "mirror clone done"

      - name: Record pre-purge state
        working-directory: ${{ runner.temp }}/mirror.git
        run: |
          set -euo pipefail
          old_main=$(git rev-parse main)
          old_tree=$(git rev-parse 'main^{tree}')
          old_commits=$(git rev-list --all --count)
          heads=$(git for-each-ref refs/heads | wc -l)
          [ "$old_main" = "$API_MAIN" ] || { echo "::error::mirror main $old_main != API main $API_MAIN"; exit 1; }
          {
            echo "OLD_MAIN=$old_main"
            echo "OLD_TREE=$old_tree"
            echo "OLD_COMMITS=$old_commits"
            echo "HEADS=$heads"
          } >> "$GITHUB_ENV"
          {
            echo "## Pre-purge"
            echo "- main: \`$old_main\`, tree \`$old_tree\`"
            echo "- commits (all refs): $old_commits; branches: $heads"
          } >> "$GITHUB_STEP_SUMMARY"
          # The rule files come from the mirror's own main, as in the runbook,
          # concatenated into ONE file: filter-repo keeps only the last
          # --replace-text it is given. The echo guarantees a newline between
          # them, so the last rule of one can't run into the first of the next.
          {
            git show main:scripts/purge/replace-fmp-values.txt
            echo
            git show main:scripts/purge/replace-vendor-labels.txt
          } > "$RUNNER_TEMP/rules.txt"
          rules=$(grep -c . "$RUNNER_TEMP/rules.txt")
          echo "RULES=$rules" >> "$GITHUB_ENV"
          echo "- rules (both files, combined into one): $rules" >> "$GITHUB_STEP_SUMMARY"
          echo "main=$old_main tree=$old_tree commits=$old_commits heads=$heads rules=$rules"

      - name: Rewrite history
        working-directory: ${{ runner.temp }}/mirror.git
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/paths.txt" <<'EOF'
          data/consensus/
          data/static-profile.json
          data/.wire/static-profile-dict.json
          glob:data/.wire/static-profile-rows-*.txt
          data/taxonomy.json
          public/preview/
          .github/workflows/step0-ground-truth.yml
          .github/workflows/consensus-freeze-commit.yml
          scripts/consensus-freeze.mjs
          app/api/debug/static-profile/
          claude/screenshots/earnings-round-2-2026-09-23/
          claude/tiingo-contract-and-limits-2026-09-23.md
          EOF
          sed -i 's/^[[:space:]]*//' "$RUNNER_TEMP/paths.txt"
          echo "paths: $(grep -c . "$RUNNER_TEMP/paths.txt")"
          # filter-repo's output stays on the runner (public log).
          if ! git filter-repo --invert-paths \
              --paths-from-file "$RUNNER_TEMP/paths.txt" \
              --replace-text "$RUNNER_TEMP/rules.txt" \
              > "$RUNNER_TEMP/filter-repo.log" 2>&1; then
            echo "::error::git filter-repo failed; nothing pushed"
            exit 1
          fi
          echo "rewrite done"

      - name: Assert paths gone
        working-directory: ${{ runner.temp }}/mirror.git
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r p; do
            [ -n "$p" ] || continue
            case "$p" in
              glob:*) spec=":(glob)${p#glob:}" ;;
              *) spec="$p" ;;
            esac
            n=$(git log --all --oneline -- "$spec" | wc -l)
            if [ "$n" -eq 0 ]; then echo "PASS  $p"; else echo "FAIL  $p ($n commits)"; fail=1; fi
          done < "$RUNNER_TEMP/paths.txt"
          if [ "$fail" -ne 0 ]; then
            echo "## Assert 1: FAIL. Nothing pushed." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::assert 1 FAIL; nothing pushed"
            exit 1
          fi
          echo "## Assert 1: PASS (all 12 paths have no history)" >> "$GITHUB_STEP_SUMMARY"

      - name: Assert main tree unchanged
        working-directory: ${{ runner.temp }}/mirror.git
        run: |
          set -euo pipefail
          new_main=$(git rev-parse main)
          new_tree=$(git rev-parse 'main^{tree}')
          if [ "$new_tree" != "$OLD_TREE" ]; then
            echo "## Assert 2: FAIL (tree \`$new_tree\` != \`$OLD_TREE\`). Nothing pushed." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::assert 2 FAIL; nothing pushed"
            exit 1
          fi
          echo "NEW_MAIN=$new_main" >> "$GITHUB_ENV"
          echo "## Assert 2: PASS (new main \`$new_main\` has tree \`$new_tree\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "assert 2 PASS new_main=$new_main"

      - name: Assert no rule matches remain
        working-directory: ${{ runner.temp }}/mirror.git
        run: |
          set -euo pipefail
          # Every blob reachable from a branch, scripts/purge/ itself excluded,
          # against every rule's match side, parsed the way filter-repo parses
          # it. Counts only: no path's contents and no rule text is printed.
          python - <<'PY'
          import os, re, subprocess, sys
          rx, lit = [], []
          with open(os.path.join(os.environ["RUNNER_TEMP"], "rules.txt"), "rb") as f:
              for line in f:
                  line = line.rstrip(b"\r\n")
                  if b"==>" in line:
                      line = line.rsplit(b"==>", 1)[0]
                  if line.startswith(b"regex:"):
                      rx.append(re.compile(line[6:]))
                  elif line.startswith(b"glob:"):
                      sys.exit("assert 3: glob rules are not supported here")
                  else:
                      if line.startswith(b"literal:"):
                          line = line[8:]
                      if line:
                          lit.append(line)
          out = subprocess.run(["git", "rev-list", "--objects", "--branches"], check=True, capture_output=True).stdout
          objs = [l.split(b" ", 1) for l in out.split(b"\n") if b" " in l]
          cat = subprocess.Popen(["git", "cat-file", "--batch"], stdin=subprocess.PIPE, stdout=subprocess.PIPE)
          blobs = hits = 0
          for oid, path in objs:
              if path.startswith(b"scripts/purge/"):
                  continue
              cat.stdin.write(oid + b"\n"); cat.stdin.flush()
              kind, size = cat.stdout.readline().split()[1:3]
              data = cat.stdout.read(int(size)); cat.stdout.read(1)
              if kind != b"blob":
                  continue
              blobs += 1
              if any(l in data for l in lit) or any(r.search(data) for r in rx):
                  hits += 1
          print(f"assert 3: rules {len(rx) + len(lit)}, blobs scanned {blobs}, blobs matching {hits}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write(f"## Assert 3: {'PASS' if hits == 0 else 'FAIL'} ({len(rx) + len(lit)} rules, {blobs} blobs scanned, {hits} matching){'' if hits == 0 else '. Nothing pushed.'}\n")
          if len(rx) + len(lit) != int(os.environ["RULES"]):
              sys.exit("assert 3 FAIL: parsed rule count differs from rules.txt; nothing pushed")
          if hits:
              sys.exit("assert 3 FAIL; nothing pushed")
          PY

      - name: Force-push branches (PAT)
        working-directory: ${{ runner.temp }}/mirror.git
        env:
          PURGE_TOKEN: ${{ secrets.PURGE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          auth=$(printf 'x-access-token:%s' "$PURGE_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          # Branches only: refs/pull/* is read-only, and there are no tags.
          git -c http.extraHeader="Authorization: Basic $auth" \
            push --quiet --force "https://github.com/$REPO.git" 'refs/heads/*:refs/heads/*'
          echo "push done"

      - name: Verify and report
        working-directory: ${{ runner.temp }}/mirror.git
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          remote_main=$(git ls-remote "https://github.com/$REPO.git" refs/heads/main | cut -f1)
          new_commits=$(git rev-list --all --count)
          remote_heads=$(git ls-remote --heads "https://github.com/$REPO.git" | wc -l)
          {
            echo "## Result"
            echo "- main: \`$OLD_MAIN\` → \`$NEW_MAIN\`"
            echo "- remote main now: \`$remote_main\`"
            echo "- commits (all refs): $OLD_COMMITS → $new_commits"
            echo "- branches: $HEADS before, $remote_heads on the remote now"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "old_main=$OLD_MAIN new_main=$NEW_MAIN remote_main=$remote_main commits=$OLD_COMMITS->$new_commits heads=$HEADS->$remote_heads"
          if [ "$remote_main" != "$NEW_MAIN" ]; then
            echo "::error::remote main is $remote_main, expected $NEW_MAIN"
            exit 1
          fi
          echo "verify PASS"
