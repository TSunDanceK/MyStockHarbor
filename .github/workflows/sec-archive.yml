name: SEC archive — backfill (Cloudflare R2)

# LAYER 1 OF THE SEC PIPELINE (#552 COWORK #65; owner chose R2, CODE-A #66).
# PR 1 is the archive and its backfill only: nothing here reads or writes Redis,
# and Layer 2 (the fact sets pages read) is untouched.
#
# ITS OWN WORKFLOW, NOT A RELAY TASK: the R2 credential is referenced here and
# nowhere else, so neither relay job (read-only or Upstash-credentialled) can
# reach the archive's write key. Dispatch only; the daily incremental job is a
# later PR.
#
# ONE runner, ≤8 SEC requests/s: SEC's fair-access limit is per requester, not
# per machine, so this is never sharded. Resumable: a run that hits its budget
# leaves the index checkpointed and the next dispatch carries on.
#
# PUBLIC LOGS: status and counts only.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max filers this run (0 = all remaining)"
        required: false
        default: "0"
      refresh:
        description: "Re-archive filers already in the index (yes/no)"
        required: false
        default: "no"

concurrency:
  group: sec-archive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Backfill
        run: node scripts/sec-archive-backfill.mjs
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          LIMIT: ${{ inputs.limit }}
          REFRESH: ${{ inputs.refresh }}
